<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.html
    </Directory>

    <Directory /var/www/html/api>
        DirectoryIndex index.php
    </Directory>

    # Race state lives under the docroot; never serve it directly.
    <Directory /var/www/html/data>
        Require all denied
    </Directory>

    # Course files are read by the API (action=track), and the balance
    # tool is CLI-only (Stage 8); neither is served directly.
    <Directory /var/www/html/api/tracks>
        Require all denied
    </Directory>
    <Directory /var/www/html/api/tools>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
