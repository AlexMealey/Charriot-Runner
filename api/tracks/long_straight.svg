<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" data-name="Long Straight">
  <!--
    A stretched oval built for gallopers: two long straights, two quick bends (about 20 % turns).
    The centre line of the course. The backend plots it (api/lib/Tracks.php)
    and every client draws two lanes either side of it. The race starts and
    finishes at the first point and runs the way the path runs; a path that
    ends in Z loops. Commands allowed: M L H V C Q Z (absolute or relative).
  -->
  <path id="centerline" fill="none" stroke="#c9a45c" stroke-width="4"
        d="M92 85 L908.00 85.00 C943.90 85.00 973.00 114.10 973.00 150.00 C973.00 185.90 943.90 215.00 908.00 215.00 L92.00 215.00 C56.10 215.00 27.00 185.90 27.00 150.00 C27.00 114.10 56.10 85.00 92.00 85.00 Z"/>
</svg>
